# 仿真专用参数覆盖: 在 params/ 之后加载, 覆盖同名参数
# 仿真车比实车小(0.26 x 0.14), 需要缩小 footprint 和膨胀半径
/**:
  ros__parameters:
    use_sim_time: true

/**:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      footprint: "[[0.13, 0.07], [0.13, -0.07], [-0.13, -0.07], [-0.13, 0.07]]"
      inflation_layer:
        inflation_radius: 0.35
        cost_scaling_factor: 4.0

/**:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      footprint: "[[0.13, 0.07], [0.13, -0.07], [-0.13, -0.07], [-0.13, 0.07]]"
      inflation_layer:
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
